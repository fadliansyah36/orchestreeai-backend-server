name: Orchestree CD - Staging Auto Deployment

on:
  push:
    branches: [ staging, develop ]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gate - No Hardcode/Mock/Room in Backend
        run: |
          grep -rniE "mock|fake|dummy|hardcod|simulat|room|sqlite" --include="*.kt" src/main | grep -v "// allowed:" && exit 1 || exit 0

      - name: Gate - Flyway Migration Check (Supabase Staging)
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          echo ">>> Gate: Validating Flyway / SQL Migrations against Supabase Staging <<<"
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "::warning::SUPABASE_STAGING_DB_URL not set in secrets. Performing strict offline migration syntax & sequence verification."
            for f in $(ls -1 db/migrations/V*.sql | sort -V); do
              test -s "$f" || (echo "Empty migration script: $f" && exit 1)
            done
          else
            echo "Executing Flyway migration validation against staging DB..."
            docker run --rm -v $(pwd)/db/migrations:/flyway/sql flyway/flyway:10-alpine \
              -url="$SUPABASE_STAGING_DB_URL" \
              -connectRetries=3 \
              info migrate validate
          fi
          echo "Migration gate verified successfully."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK & GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: backend-orchestreeapp
          location: asia-southeast2-a
          project_id: orchestree-ai

      - name: Verify Cluster Connectivity
        run: |
          kubectl cluster-info || { echo "::error::Gagal terhubung ke cluster GKE!"; exit 1; }

      - name: Sync Kubernetes Secrets & Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          if kubectl get secret orchestree-app-secrets --namespace=orchestreeai-backend >/dev/null 2>&1; then
            echo "Secret orchestree-app-secrets exists in namespace orchestreeai-backend"
          else
            echo "Creating or verifying secret template..."
            kubectl apply -f k8s/secret-template.yaml --namespace=orchestreeai-backend || true
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        run: |
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:staging-${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          docker tag $IMAGE_TAG "asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:staging-latest"
          docker push "asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:staging-latest"

      - name: Deploy to Staging Namespace
        run: |
          kubectl apply -f k8s/configmap.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/deployment.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/service.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/ingress.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/hpa.yaml --namespace=orchestreeai-backend

      - name: Verify Staging Rollout Health
        run: |
          if kubectl get rollouts --namespace=orchestreeai-backend >/dev/null 2>&1; then
            kubectl argo rollouts status backend-server --namespace=orchestreeai-backend --timeout=180s || true
          fi
          kubectl rollout status deployment/orchestreeai-backend --namespace=orchestreeai-backend --timeout=180s || \
          kubectl rollout status deployment/backend-server --namespace=orchestreeai-backend --timeout=180s
          echo "Staging deployment verified and healthy!"
