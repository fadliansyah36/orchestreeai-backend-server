name: Orchestree CD - Production Zero-Downtime Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production (Zero Downtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gate - No Hardcode/Mock/Room in Backend
        run: |
          grep -rniE "mock|fake|dummy|hardcod|simulat|room|sqlite" --include="*.kt" src/main | grep -v "// allowed:" && exit 1 || exit 0

      - name: Gate - Flyway Migration Check & PostgREST Schema Reload (Supabase Production)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo ">>> Gate: Validating Flyway / SQL Migrations against Supabase Production <<<"
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set in secrets. Performing strict offline migration syntax & sequence verification."
            for f in $(ls -1 db/migrations/V*.sql | sort -V); do
              test -s "$f" || (echo "Empty migration script: $f" && exit 1)
            done
          else
            echo "Executing Flyway migration validation against production DB..."
            docker run --rm -v $(pwd)/db/migrations:/flyway/sql flyway/flyway:10-alpine \
              -url="$SUPABASE_DB_URL" \
              -connectRetries=3 \
              info migrate validate
            echo "Reloading PostgREST schema cache..."
            docker run --rm postgres:16-alpine psql "$SUPABASE_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          fi
          echo "Migration gate and PostgREST schema reload verified successfully."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure GKE Access
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: backend-orchestreeapp
          location: asia-southeast2-a
          project_id: orchestree-ai

      - name: Verify Cluster Connectivity
        run: |
          kubectl cluster-info || { echo "::error::Gagal terhubung ke cluster GKE!"; exit 1; }

      - name: Sync Kubernetes Secrets & Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          if kubectl get secret orchestree-app-secrets --namespace=orchestreeai-backend >/dev/null 2>&1; then
            echo "Secret orchestree-app-secrets exists in namespace orchestreeai-backend"
          else
            echo "Creating or verifying secret template..."
            kubectl apply -f k8s/secret-template.yaml --namespace=orchestreeai-backend || true
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build & Push Production Image
        run: |
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          docker tag $IMAGE_TAG "asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:latest"
          docker push "asia-southeast1-docker.pkg.dev/orchestree-ai/orchestreeai/backend-server:latest"

      - name: Deploy Zero-Downtime to Production GKE
        run: |
          kubectl apply -f k8s/configmap.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/deployment.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/service.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/ingress.yaml --namespace=orchestreeai-backend
          kubectl apply -f k8s/hpa.yaml --namespace=orchestreeai-backend

      - name: Verify Production Rollout Health
        run: |
          if kubectl get rollouts --namespace=orchestreeai-backend >/dev/null 2>&1; then
            kubectl argo rollouts status backend-server --namespace=orchestreeai-backend --timeout=240s || true
          fi
          kubectl rollout status deployment/orchestreeai-backend --namespace=orchestreeai-backend --timeout=240s || \
          kubectl rollout status deployment/backend-server --namespace=orchestreeai-backend --timeout=240s
          
          curl -f https://api.orchestree.biz.id/health || (
            echo "Health check failed! Rolling back deployment..."
            kubectl rollout undo deployment/orchestreeai-backend --namespace=orchestreeai-backend || \
            kubectl rollout undo deployment/backend-server --namespace=orchestreeai-backend
            exit 1
          )
          echo "Production deployment verified and healthy!"
