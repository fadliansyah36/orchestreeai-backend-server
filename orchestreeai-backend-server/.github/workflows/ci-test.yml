name: Backend CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Gate - No Hardcode/Mock/Room in Backend
        run: |
          grep -rniE "mock|fake|dummy|hardcod|simulat|room|sqlite" --include="*.kt" src/main | grep -v "// allowed:" && exit 1 || exit 0

      - name: Gate - Verify No Unauthorized AI SDK
        run: gradle verifyNoUnauthorizedAiSdk --no-daemon

      - name: Run Unit Tests
        run: gradle test --no-daemon

      - name: Build Artifact
        run: gradle build --no-daemon -x test
